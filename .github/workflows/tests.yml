name: tests

# Runs the offline test suite on every push and pull request. The suite needs
# no network, no API key, and no ChromaDB index, so it is safe to run in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Only what the offline suite imports. The heavy runtime dependencies
        # (chromadb, sentence-transformers, the Gemini SDK) are not needed to
        # exercise the contracts these tests protect.
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv rank-bm25 numpy

      - name: Run the test suite
        run: python -m pytest tests/ -v

  evidence-files:
    # The thesis cites these result files by path and reports figures computed
    # from them. If any goes missing the reported numbers stop being verifiable,
    # so treat their absence as a build failure.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Confirm every cited evaluation result file is present
        run: |
          set -e
          for f in \
            data/gcc_eval/multi_run_summary.json \
            data/gcc_eval/full_eval_results.json \
            data/gcc_eval/baseline_naive_rag_results.json \
            data/gcc_eval/baseline_no_retrieval_results.json \
            data/gcc_eval/ablation_results.json \
            data/sec_recent/multi_run_summary.json \
            data/financebench/ablation_results.json ; do
              test -f "$f" && echo "present: $f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Confirm the headline figures still match the result files
        run: |
          python - <<'PY'
          import json, sys
          gcc = json.load(open("data/gcc_eval/multi_run_summary.json"))
          sec = json.load(open("data/sec_recent/multi_run_summary.json"))
          checks = [
              ("GCC accuracy",     round(gcc["accuracy_mean"], 1),     96.8),
              ("GCC faithfulness", round(gcc["faithfulness_mean"], 1), 99.4),
              ("SEC accuracy",     round(sec["accuracy_mean"], 1),     98.9),
          ]
          bad = [(n, got, want) for n, got, want in checks if got != want]
          for n, got, want in checks:
              print(f"{'OK ' if (n, got, want) not in bad else 'FAIL'} {n}: {got} (thesis reports {want})")
          if bad:
              sys.exit("Result files no longer match the figures reported in the thesis.")
          PY
